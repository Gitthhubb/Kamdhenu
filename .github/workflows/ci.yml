name: Build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/app-hardening, feat/public-auth-render-data, feature/firebase-ledger]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      - name: Enforce dependency security audit
        run: npm audit --audit-level=high
